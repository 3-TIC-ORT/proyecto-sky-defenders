<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sky Defenders</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="icon" href="../imgs/icono.ico" />
  </head>
  <body>
    <p id="puntaje" class="datos">Puntaje: 0</p>
    <p id="vidas" class="datos">Vidas: 3</p>
    <p id="niveles" class="datos">Nivel: 1</p>

    <img
      id="menuBoton"
      src="../imgs/hamburguesa.png"
      alt="menu"
      class="menu-boton"
    />

    <div id="menu-div" class="menu-div">
      <h2>Menú</h2>
      <div class="div-botones">
        <button id="inicioBoton">Ir al inicio</button>
        <button id="reanudarBoton">Reanudar</button>
        <button id="tablaBoton">Tabla de clasificación</button>
        <button id="cfg">Configuración</button>
      </div>
    </div>
    <div id="cfg-div">
      <h2>Configuración</h2>
      <div class="div-botones">
        <button id="eeBoton">Efectos especiales: ON</button>
        <button id="musicaBoton">Música: ON</button>
        <button id="atrasBoton">Atrás</button>
      </div>
    </div>

    <audio id="audio" loop>
      <source src="../imgs/Cielo%20Pixelado.mp3" type="audio/mp3" />
    </audio>

    <script src="../js/main.js"></script>
  </body>
</html>
