<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sky Defenders</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/JZylber/SoqueTIC-Client@v1.4.2/soquetic-client.js"></script>
    <script defer src="../js/main.js"></script>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="icon" href="../imgs/icono.ico" />
  </head>
  <body>
    <img id="loading" src="../imgs/loading.gif" alt="Pantalla de Carga" />
    <div class="divDatos" id="divTiempo">
      <img id="tiempoImg" src="../imgs/Tiempo.gif" alt="">
      <p id="tiempo" class="datos">0:00</p>
    </div>
    <div class="divDatos" id="divPuntaje">
      <img src="../imgs/SCORE.png" alt="">
      <p id="puntaje" class="datos">0</p>
    </div>
    <div class="divDatos" id="divNiveles">
      <img src="../imgs/LEVEL.png" alt="">
      <p id="niveles" class="datos">1</p>
    </div>
    <div class="life-bar-container" id="life-bar-container">
      <img id="marcoVidaBoss" src="../imgs/lifeBarBoss.png" alt="">
      <div class="divLife-bar">
        <div id="life-bar" class="life-bar"></div>
      </div>
    </div>

    <img
      id="menuBoton"
      src="../imgs/botonPausa.png"
      alt="menu"
      class="menu-boton"
    />

    <div id="menu-div" class="menu-div">
      <div class="menu-content">
        <h2>Menú</h2>
        <div class="div-botones">
          <img id="reanudarBoton" src="../imgs/botonResume.png" />
          <img id="reintentarBoton" src="../imgs/botonRestart.png" />
          <img id="inicioBoton" src="../imgs/botonHome.png" />
          <img id="cfg" src="../imgs/botonconfiguración.png" />
        </div>
      </div>
    </div>
    <div id="cfg-div">
      <div class="cfg-content">
        <h2>Configuración</h2>
        <div class="div-botones">
          <img id="esBoton" class="esBoton" src="../imgs/Boton Audio.png" />
          <div class="cfg-row">
            <input
              id="effectsVolume"
              type="range"
              min="0"
              max="1"
              step="0.01"
            />
            <span id="effectsValue">100%</span>
          </div>
          <img
            id="musicaBoton"
            class="musicaBoton"
            src="../imgs/Boton Musica.png"
          />
          <div class="cfg-row">
            <input id="musicVolume" type="range" min="0" max="1" step="0.01" />
            <span id="musicValue">100%</span>
          </div>
          <button id="atrasBoton">Atrás</button>
        </div>
      </div>
    </div>

    <h1 id="transition-text">Nivel 2</h1>

    <audio
      id="audio"
      src="../imgs/Cielo%20Pixelado.mp3"
      type="audio/mp3"
      loop
    ></audio>

    <audio
      id="audioDisparo"
      src="../imgs/laserShoot.mp3"
      type="audio/mp3"
    ></audio>

    <audio
      id="audioMuertePlayer"
      src="../imgs/muertePlayer.mp3"
      type="audio/mp3"
    ></audio>
  </body>
</html>
