<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sky Defenders</title>
    <link rel="icon" href="../imgs/icono.ico" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/JZylber/SoqueTIC-Client@v1.4.2/soquetic-client.js"></script>
  </head>
  <body>
    <div id="DivCartelSkyDefenders">
      <img src="../imgs/SkyDefenders.png" alt="" />
    </div>
    <div id="divJugar">
      <a href="elecciónPaíses.html"
        ><img src="../imgs/Button_NotPressed_Sprite.png" id="jugar"
      /></a>
    </div>
    <style>
      body {
        background: url(../imgs/fondosimple.png) no-repeat center fixed,
          linear-gradient(
            252.46deg,
            #2596ff 0%,
            #1156bd 38.46%,
            #133a76 74.52%,
            #132b4e 100%
          );
        background-size: cover;
        overflow: hidden;
      }

      #DivCartelSkyDefenders {
        display: flex;
        align-items: center;
        justify-content: space-evenly;
        height: 45vh;
      }

      #divJugar {
        display: flex;
        align-items: end;
        justify-content: center;
        height: 55vh;
      }

      #jugar {
        width: 300px;
        padding: 10px;
      }

      #jugar:active {
        content: url(../imgs/Button_Pressed_Sprite.png);
      }

      #jugar.pressed {
        content: url(../imgs/Button_Pressed_Sprite.png);
      }

    </style>
    <script>
      connect2Server(3000);

      let señal;

      subscribeRealTimeEvent("nuevaSeñal", (data) => {
          if (data) {
            const texto = data; 
          señal = texto.señal === "b1" ? "b1" : null;
          
          console.log(señal);
          
            if (!señal) return; 

            if (señal) {
              const a = document.getElementById("jugar");
              a.classList.add("pressed");

              setTimeout(() => {
                a.click();
              }, 50);
            }
          }
      });
    </script>
  </body>
</html>
