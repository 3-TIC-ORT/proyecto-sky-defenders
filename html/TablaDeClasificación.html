<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sky Defenders</title>
    <link rel="icon" href="../imgs/icono.ico" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/JZylber/SoqueTIC-Client@v1.4.2/soquetic-client.js"></script>
    <script defer src="../js/TablaDeclasificación.js"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
        background: url(../imgs/fondosimple.png) no-repeat center fixed,
          linear-gradient(
            252.46deg,
            #2596ff 0%,
            #1156bd 38.46%,
            #133a76 74.52%,
            #132b4e 100%
        );
        background-size: cover;
      }
      h2 {
        padding: 15px;
        margin: 0;
        color: #fff;
      }
      #div-tabla {
        max-height: 465px;
        background-color: rgb(20, 20, 181);
        padding: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        border-radius: 10px;
        width: 50vw;
      }
      #tabla {
        background-color: rgb(20, 20, 181);
        max-height: 410px;
        overflow-y: auto;
        overflow-x: hidden;
      }
      table {
        background-color: #fff;
        border-collapse: collapse;
        width: 50vw;
      }
      th,
      td {
        border: 1px solid #333;
        padding: 8px 12px;
        text-align: center;
      }
      th {
        background-color: #f2f2f2;
      }
      #verMas {
        cursor: pointer;
        border-radius: 6px;
        border: none;
      }
      #verMas:hover {
        background-color: #e0e0e0;
      }
      #botonExit {
        width: 150px;
      }
      #botonExit:active {
        content: url("../imgs/BotonExitPresionado.png");
      }
      #botonExit.pressed {
        content: url("../imgs/BotonExitPresionado.png");
      }
      #divBotonExit {
        position: fixed;
        bottom: 20px;
        width: 100vw;
        display: flex;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div id="div-tabla">
      <h2 style="text-align: center">🏆Tabla de clasificación🏆</h2>
      <div id="tabla">
        <table>
          <thead>
            <tr>
              <th></th>
              <th>Nombre</th>
              <th>Puntuación</th>
              <th>Tiempo</th>
            </tr>
          </thead>
          <tbody id="tabla-cuerpo"></tbody>
        </table>
        <button id="verMas">Ver más</button>
      </div>
    </div>
    <div id="divBotonExit">
      <img src="../imgs/BotonExit.png" alt="Boton de exit" id="botonExit">
    </div>
  </body>
</html>
