<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sky Defenders</title>
    <link rel="icon" href="../imgs/icono.ico" />
  </head>
  <body>
    <div id="DivCartelYouWin">
      <img src="../imgs/YouWinCartel.png" alt="Cartel de You Win" id="cartelYouWin">
    </div>
    <div id="divExit">
    <a href="Save.html" id="botonExit"><img src="../imgs/BotonExit.png" alt="BotónExit"/></a>
    </div>
    <style>
      body {
        height: 100vh;
        background: url(../imgs/YouWin.png) no-repeat center fixed,
          linear-gradient(
            252.46deg,
            #2596ff 0%,
            #1156bd 38.46%,
            #133a76 74.52%,
            #132b4e 100%
          );
        background-size: cover;
        overflow: hidden;
      }

      #DivCartelYouWin {
        display: flex;
        align-items: center;
        justify-content: space-evenly;
        height: 60vh;
      }

      #divExit {
        position: absolute;
        width: 100vw;
        bottom: 40px;
        display: flex;
        justify-content: center;
        gap: 80px;
        align-items: center;
      }
      #botonExit:active {
        content: url(../imgs/BotonExitPresionado.png);
      }
      #cartelYouWin{
        width: 350px;
      }
    </style>
  </body>
</html>
