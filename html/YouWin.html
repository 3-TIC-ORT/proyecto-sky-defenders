<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sky Defenders</title>
    <link rel="icon" href="../imgs/icono.ico" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/JZylber/SoqueTIC-Client@v1.4.2/soquetic-client.js"></script>
  </head>
  <body>
    <div id="DivCartelYouWin">
      <img
        src="../imgs/YouWinCartel.png"
        alt="Cartel de You Win"
        id="cartelYouWin"
      />
    </div>
    <div id="divExit">
      <a href="Save.html" id="botonExit"
        ><img src="../imgs/BotonExit.png" alt="BotónExit"
      /></a>
    </div>
    <style>
      body {
        height: 100vh;
        background: url(../imgs/YouWin.png) no-repeat center fixed,
          linear-gradient(
            252.46deg,
            #2596ff 0%,
            #1156bd 38.46%,
            #133a76 74.52%,
            #132b4e 100%
          );
        background-size: cover;
        overflow: hidden;
      }

      #DivCartelYouWin {
        display: flex;
        align-items: center;
        justify-content: space-evenly;
        height: 60vh;
      }

      #divExit {
        position: absolute;
        width: 100vw;
        bottom: 40px;
        display: flex;
        justify-content: center;
        gap: 80px;
        align-items: center;
      }
      #botonExit:active {
        content: url(../imgs/BotonExitPresionado.png);
      }
      #cartelYouWin {
        width: 350px;
      }
      #botonExit.pressed {
        content: url(../imgs/BotonExitPresionado.png);
      }
    </style>
    <script>
      connect2Server(3000);

      let señal;

      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          const a = document.getElementById("botonExit");
          a.classList.add("pressed");

          setTimeout(() => {
            a.click();
          }, 50);
        }
        if (e.key === "Escape") {
          window.location.href = "../html/Save.html";
        }
      });

      subscribeRealTimeEvent("nuevaSeñal", (data) => {
        if (data) {
          const texto = data;
          señal = texto.señal === "b1" ? "b1" : null;

          if (!señal) return;

          if (señal) {
            const a = document.getElementById("botonExit");
            a.classList.add("pressed");

            setTimeout(() => {
              a.click();
            }, 50);
          }
        }
      });
    </script>
  </body>
</html>
