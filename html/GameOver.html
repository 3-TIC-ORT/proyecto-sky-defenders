<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sky Defenders</title>
    <link rel="icon" href="../imgs/icono.ico" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.1/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/JZylber/SoqueTIC-Client@v1.4.2/soquetic-client.js"></script>
  </head>
  <body>
    <style>
      body {
        height: 100vh;
        background: url(../imgs/fondogameover.png) no-repeat center fixed,
          linear-gradient(
            252.46deg,
            #2596ff 0%,
            #1156bd 38.46%,
            #133a76 74.52%,
            #132b4e 100%
          );
        background-size: cover;
        overflow: hidden;
      }

      #DivCartelGameOver {
        display: flex;
        align-items: center;
        justify-content: space-evenly;
        height: 45vh;
      }

      #divRetryyExit {
        position: absolute;
        width: 100vw;
        bottom: 40px;
        display: flex;
        justify-content: center;
        gap: 80px;
        align-items: center;
      }
      #botonRetry:active {
        content: url(../imgs/BotonRetryPresionado.png);
      }
      #botonRetry.pressed {
        content: url(../imgs/BotonRetryPresionado.png);
      }
      #botonExit:active {
        content: url(../imgs/BotonExitPresionado.png);
      }
      #botonExit.pressed {
        content: url(../imgs/BotonExitPresionado.png);
      }
    </style>

    
    <div id="DivCartelGameOver">
      <img src="../imgs/GameOver.png" alt="">
    </div>
    <div id="divRetryyExit">
    <a href="" id="botonRetry"><img src="../imgs/BotonRetry.png" alt="BotónRetry"/></a>
    <a href="Save.html"><img id="botonExit" src="../imgs/BotonExit.png" alt="BotónExit" /></a>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      this.pais = params.get("pais");
      this.tipo = params.get("tipo");

      let botoExit = document.getElementById("botonRetry");

      botoExit.href = "index.html?pais=" + this.pais + "&tipo=" + this.tipo;

      connect2Server(3000);

      let señal;

      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          const a = document.getElementById("botonExit");
          a.classList.add("pressed");
        
          setTimeout(() => {
            a.click();
          }, 50);
        }
        if (e.key === "Escape") {
          window.location.href = "../html/Save.html";
        }
      });

      subscribeRealTimeEvent("nuevaSeñal", (data) => {
        if (data) {
          const texto = data;
          señal = texto.señal === "b1" ? "b1" : texto.señal === "b2" ? "b2" : null;
        
          if (!señal) return;
        
          if (señal === "b1") {
            const a = document.getElementById("botonRetry");
            a.classList.add("pressed");
          
            setTimeout(() => {
              a.click();
            }, 50);
          }

          if (señal === "b2") {
            const b = document.getElementById("botonExit");
            b.classList.add("pressed");
          
            setTimeout(() => {
              b.click();
            }, 50);
          }
        }
      });
    </script>
  </body>
</html>
