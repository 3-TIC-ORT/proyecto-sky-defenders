<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sky Defenders</title>
    <link rel="icon" href="../imgs/icono.ico" />
  </head>
  <body>
    <style>
      body {
        height: 100vh;
        background: url(../imgs/fondogameover.png) no-repeat center fixed,
          linear-gradient(
            252.46deg,
            #2596ff 0%,
            #1156bd 38.46%,
            #133a76 74.52%,
            #132b4e 100%
          );
        background-size: cover;
        overflow: hidden;
      }

      #DivCartelGameOver {
        display: flex;
        align-items: center;
        justify-content: space-evenly;
        height: 45vh;
      }

      #divRetryyExit {
        position: absolute;
        width: 100vw;
        bottom: 40px;
        display: flex;
        justify-content: center;
        gap: 80px;
        align-items: center;
      }
      #botonRetry:active {
        content: url(../imgs/BotonRetryPresionado.png);
      }
      #botonExit:active {
        content: url(../imgs/BotonExitPresionado.png);
      }
    </style>

    
    <div id="DivCartelGameOver">
      <img src="../imgs/GameOver.png" alt="">
    </div>
    <div id="divRetryyExit">
    <a href="" id="botonRetry"><img src="../imgs/BotonRetry.png" alt="BotónRetry"/></a>
    <a href="Save.html"><img id="botonExit" src="../imgs/BotonExit.png" alt="BotónExit" /></a>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      this.pais = params.get("pais");
      this.tipo = params.get("tipo");

      let botoExit = document.getElementById("botonRetry");

      botoExit.href = "index.html?pais=" + this.pais + "&tipo=" + this.tipo;
    </script>
  </body>
</html>
